<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Portal | Authentication</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body {
            background: #090d16;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(59, 130, 246, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.12) 0%, transparent 40%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 2.5rem;
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
            animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .brand-header {
            text-align: center;
            margin-bottom: 1.75rem;
        }

        .brand-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #ffffff;
            margin-bottom: 0.25rem;
        }

        .brand-header p {
            font-size: 0.875rem;
            color: #94a3b8;
        }

        .tabs {
            display: flex;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 1.75rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .tabs button {
            flex: 1;
            background: none;
            border: none;
            color: #94a3b8;
            padding: 10px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            border-radius: 9px;
            transition: all 0.25s ease;
        }

        .tabs button.active {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: #fff;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .input-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.8125rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: #cbd5e1;
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(15, 23, 42, 0.8);
            color: #fff;
            outline: none;
            font-size: 0.9375rem;
            transition: all 0.2s ease;
        }

        input::placeholder {
            color: #475569;
        }

        input:focus {
            border-color: #3b82f6;
            background: rgba(15, 23, 42, 1);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border: none;
            color: white;
            font-weight: 600;
            font-size: 0.9375rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3);
            margin-top: 0.5rem;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.3);
        }
        .btn-danger:hover {
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
        }

        .msg {
            font-size: 0.875rem;
            margin-bottom: 1.25rem;
            padding: 10px 14px;
            border-radius: 8px;
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .msg.error { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); display: block; }
        .msg.success { background: rgba(34, 197, 94, 0.1); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.2); display: block; }

        .hidden { display: none !important; }

        /* Welcome / Loading Screen Animation */
        .welcome-screen { text-align: center; padding: 1.5rem 0; }
        .welcome-screen h3 { font-size: 1.25rem; color: #4ade80; margin-bottom: 0.5rem; font-weight: 600; }
        .welcome-screen p { color: #94a3b8; font-size: 0.9rem; }
        .spinner { width: 36px; height: 36px; border: 3px solid rgba(59, 130, 246, 0.15); border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite; margin: 1.5rem auto 0 auto; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Dashboard View Styling */
        .dashboard-view { text-align: center; }
        .dashboard-view h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; color: #fff; }
        .dashboard-view p { color: #94a3b8; font-size: 0.9375rem; line-height: 1.5; margin-bottom: 1.5rem; }
        .user-pill {
            display: inline-flex;
            align-items: center;
            background: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.2);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8125rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- AUTH VIEW -->
        <div id="authView">
            <div class="brand-header">
                <h1>SecurePortal</h1>
                <p>Sign in or create an account to continue</p>
            </div>

            <div class="tabs">
                <button id="tabLogin" class="active" onclick="switchTab('login')">Sign In</button>
                <button id="tabRegister" onclick="switchTab('register')">Register</button>
            </div>

            <div id="alertMsg" class="msg"></div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="loginEmail" required placeholder="name@example.com">
                    </div>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="loginPassword" required placeholder="••••••••">
                    </div>
                </div>
                <button type="submit" class="btn">Sign In</button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
                <div class="input-group">
                    <label>Full Name</label>
                    <div class="input-wrapper">
                        <input type="text" id="regUsername" required placeholder="Bayanda Khumalo">
                    </div>
                </div>
                <div class="input-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="regEmail" required placeholder="name@example.com">
                    </div>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="regPassword" required placeholder="At least 6 characters">
                    </div>
                </div>
                <button type="submit" class="btn">Create Account</button>
            </form>
        </div>

        <!-- WELCOME / SUCCESS FEEDBACK SCREEN -->
        <div id="welcomeScreen" class="welcome-screen hidden">
            <h3 id="feedbackTitle">Success!</h3>
            <p id="feedbackText">Setting up your session...</p>
            <div class="spinner"></div>
        </div>

        <!-- DASHBOARD VIEW (Protected) -->
        <div id="dashboardView" class="dashboard-view hidden">
            <h2>Welcome back</h2>
            <p>Hello, <strong id="displayName" style="color: #fff;">User</strong>! You have successfully accessed your secure workspace session.</p>
            <div class="user-pill">● Active Browser Session</div>
            <button class="btn btn-danger" onclick="handleLogout()">Sign Out</button>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const activeUser = localStorage.getItem('app_activeUser');
            if (activeUser) {
                showDashboard(JSON.parse(activeUser).username);
            }
        });

        function showAlert(message, type = 'error') {
            const alertBox = document.getElementById('alertMsg');
            alertBox.textContent = message;
            alertBox.className = `msg ${type}`;
        }

        function clearAlert() {
            const alertBox = document.getElementById('alertMsg');
            alertBox.textContent = '';
            alertBox.className = 'msg';
        }

        function switchTab(tab) {
            clearAlert();
            const tabLogin = document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabRegister');
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');

            if (tab === 'login') {
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
            } else {
                tabRegister.classList.add('active');
                tabLogin.classList.remove('active');
                registerForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            clearAlert();

            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim().toLowerCase();
            const password = document.getElementById('regPassword').value;

            if (password.length < 6) {
                showAlert('Password must be at least 6 characters long.');
                return;
            }

            const users = JSON.parse(localStorage.getItem('app_users') || '[]');

            if (users.some(u => u.email === email)) {
                showAlert('An account with this email already exists.');
                return;
            }

            users.push({ username, email, password });
            localStorage.setItem('app_users', JSON.stringify(users));

            document.getElementById('authView').classList.add('hidden');
            const welcomeScreen = document.getElementById('welcomeScreen');
            document.getElementById('feedbackTitle').textContent = 'Account Created!';
            document.getElementById('feedbackText').textContent = `Welcome, ${username}! Redirecting to sign in...`;
            welcomeScreen.classList.remove('hidden');

            setTimeout(() => {
                welcomeScreen.classList.add('hidden');
                document.getElementById('authView').classList.remove('hidden');
                document.getElementById('registerForm').reset();
                switchTab('login');
            }, 1500);
        }

        function handleLogin(e) {
            e.preventDefault();
            clearAlert();

            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value;

            const users = JSON.parse(localStorage.getItem('app_users') || '[]');
            const user = users.find(u => u.email === email && u.password === password);

            if (!user) {
                showAlert('Invalid email or password.');
                return;
            }

            document.getElementById('authView').classList.add('hidden');
            const welcomeScreen = document.getElementById('welcomeScreen');
            document.getElementById('feedbackTitle').textContent = 'Welcome Back!';
            document.getElementById('feedbackText').textContent = `Authenticating session for ${user.username}...`;
            welcomeScreen.classList.remove('hidden');

            setTimeout(() => {
                localStorage.setItem('app_activeUser', JSON.stringify({ username: user.username, email: user.email }));
                welcomeScreen.classList.add('hidden');
                showDashboard(user.username);
            }, 1200);
        }

        function showDashboard(username) {
            document.getElementById('displayName').textContent = username;
            document.getElementById('authView').classList.add('hidden');
            document.getElementById('welcomeScreen').classList.add('hidden');
            document.getElementById('dashboardView').classList.remove('hidden');
        }

        function handleLogout() {
            localStorage.removeItem('app_activeUser');
            document.getElementById('dashboardView').classList.add('hidden');
            document.getElementById('authView').classList.remove('hidden');
            document.getElementById('loginForm').reset();
            clearAlert();
            switchTab('login');
        }
    </script>
</body>
</html>
